name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The version comes from the workspace, so CI and every developer run the
      # same Go toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache-dependency-path: |
            apps/cli/go.sum
            tools/go.sum

      - name: Download the dependencies
        run: make deps

      # fmt-check, lint, build, test, race, vuln — the same gate a developer
      # runs locally with `make all`.
      - name: Quality gate
        run: make all
