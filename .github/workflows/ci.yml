# PACA — continuous integration.
#
# The workflow runs the same gate a contributor runs locally, through the
# root Makefile of the monorepository:
#
#   make gate                the quality gate of every application and every package
#   make packages-integration  the container tests of every package
#   make apps-integration     the container tests of every application
#   make db-up               every database, up and healthy
#   make db-smoke            the smoke test of every database
#   make shellcheck          the shell scripts of the repository
#   make observability-up    the collector of the traces, up and healthy
#   make observability-smoke the smoke test of the collector
#   make stack-up            the whole monorepository, up and healthy
#   make stack-schema        the assertion of the schema of the database
#
# The workflow never names a stack: a new application or a new database
# joins the tree through the root Makefile alone.
#
# Every job runs only when the files of the change can affect what it
# proves. GitHub Actions filters the files of a run only at the level of the
# workflow, so the job `changes` computes them here and the rules of
# scripts/ci/job-filters.txt say which job each one needs. A job that is
# skipped is a visible statement that its check was not needed: the
# workflow always reaches a conclusion.
#
# A pull request is green when every job is green, and a skipped job is
# green: it says that the change cannot affect what it proves.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The workflow reads the repository and nothing else.
permissions:
  contents: read

# A new push to the same branch makes the older run unnecessary.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The changes: the files of the run, and the jobs that need them.
  #
  # The rules live in the repository, in scripts/ci/job-filters.txt, so a
  # rule is a change of the code and not a comment of the workflow. The
  # tests of the filters (make ci-filters-test) prove them against a matrix
  # of changes.
  changes:
    name: The changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gate: ${{ steps.detect.outputs.gate }}
      database: ${{ steps.detect.outputs.database }}
      observability: ${{ steps.detect.outputs.observability }}
      stack: ${{ steps.detect.outputs.stack }}
      shellcheck: ${{ steps.detect.outputs.shellcheck }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # The whole history: the base of the comparison is a commit of the
          # repository, and it must be here to be diffed.
          fetch-depth: 0

      - name: Detect the changes
        env:
          # The base of the comparison is the commit the branch starts from,
          # and the head is the commit the run carries. A manual run carries
          # no change: every job runs.
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ./scripts/ci/changed-jobs.sh \
            --filters scripts/ci/job-filters.txt \
            --event "$EVENT" \
            --base "$BASE" \
            --head "$HEAD" >> "$GITHUB_OUTPUT"

  # The quality gate: fmt-check, vet, lint, build, test, race, cover and
  # vuln, over every application of the workspace.
  gate:
    name: The quality gate
    needs: changes
    if: needs.changes.outputs.gate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # The version of the repository is the one of the workspace, and
          # the linter and the scanner are the tool dependencies of the
          # module tools: a contributor needs nothing but the Go toolchain.
          go-version-file: go.work
          cache: true
          cache-dependency-path: |
            go.work.sum
            apps/mcp-server/go.sum
            apps/db-admin/go.sum
            packages/database/go.sum
            packages/platform/go.sum
            tools/go.sum

      - name: Run the quality gate
        run: make gate

      # The container tests of the shared libraries start a PostgreSQL with
      # the schema of the migrations and assert the rules of the tables
      # against it. The runner has Docker, so they run here.
      - name: Run the container tests of the shared libraries
        run: make packages-integration

      # The container tests of the applications build the image of the
      # service and start it against a PostgreSQL. The rules of the
      # composition root — the service applies the migrations when it
      # starts and it keeps serving — can only be asserted against the
      # real thing, so these tests are part of the gate. The runner has
      # Docker, so they run here.
      - name: Run the container tests of the applications
        run: make apps-integration

  # The database: the image of the stack is built, the cluster starts, and
  # the smoke test asserts the guarantees it promises — UTF-8, UTC, UUID,
  # vector search, checksums and isolation.
  database:
    name: The database
    needs: changes
    if: needs.changes.outputs.database == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The smoke test asks the host whether the port of the database leaked,
      # so the host needs the netcat of the distribution.
      - name: Install the tools of the host
        run: |
          sudo apt-get update
          sudo apt-get install --yes netcat-openbsd

      # The credentials live with the stack that owns them and are never
      # committed, so the runner generates them with the installer of the
      # environment: it keeps the defaults and generates a strong password.
      - name: Create the credentials of the stack
        run: make env-init ARGS="--yes"

      - name: Start the database
        run: make db-up

      - name: Run the smoke test of the database
        run: make db-smoke

      - name: Stop the database
        if: always()
        run: make db-down

  # The collector of the traces: the stack starts, and the smoke test
  # asserts that its query API answers.
  observability:
    name: The observability
    needs: changes
    if: needs.changes.outputs.observability == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Start the collector of the traces
        run: make observability-up

      - name: Run the smoke test of the collector
        run: make observability-smoke

      - name: Stop the collector of the traces
        if: always()
        run: make observability-down

  # The whole monorepository from nothing: the credentials of the stacks
  # are written, the project comes up, and the schema of the database is
  # asserted. The schema is written by the service that owns it, so the
  # assertion proves that the stack comes up with its schema, on a machine
  # that has no image, no container and no volume.
  stack:
    name: The stack
    needs: changes
    if: needs.changes.outputs.stack == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # The credentials live with the stacks that own them and are never
      # committed, so the runner generates them with the installer of the
      # environment: it keeps the defaults and generates a strong password.
      - name: Create the credentials of the stacks
        run: make env-init ARGS="--yes"

      - name: Start the whole stack
        run: make stack-up

      - name: Assert the schema of the database
        run: make stack-schema

      - name: Stop the whole stack
        if: always()
        run: make stack-down

  # The shell scripts of the repository: the smoke test of the database and
  # every script a stack brings.
  shellcheck:
    name: The shellcheck
    needs: changes
    if: needs.changes.outputs.shellcheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Run shellcheck
        run: make shellcheck

      # The installer of the environment is a script of the repository, so
      # its own tests run here. They work against fixtures in a temporary
      # directory: the credentials of the runner are never touched.
      - name: Run the tests of the installer of the environment
        run: make env-test

      # The structure of the repository is a promise of its own: every
      # module resolves its own graph and its own dependencies, every link of
      # the documentation points at a file that exists, and the layers of
      # every application respect the direction of the dependencies. The
      # tests of the structure prove it.
      - name: Run the tests of the structure of the repository
        run: make structure-test

      # The rules of the job filters are the promise of the workflow: a job
      # runs only when the change can affect what it proves. The tests prove
      # them against a matrix of changes.
      - name: Run the tests of the filters of the continuous integration
        run: make ci-filters-test
