[workspace]
resolver = "2"
members = [
    "crates/shared",
    "crates/server",
    "crates/ui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["witsaba"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Web framework
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Database
rusqlite = { version = "0.33", features = ["bundled"] }

# Error handling
thiserror = "2"
anyhow = "1"
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Date/Time
chrono = { version = "0.4", features = ["serde"] }

# Leptos
leptos = "0.7"
leptos_meta = "0.7"
leptos_router = "0.7"

# UI
tauri-bindgen = "0.1"
