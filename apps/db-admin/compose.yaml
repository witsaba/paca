# The stack of the database admin service.
#
# The service is private: it publishes no port, so it is reachable from the
# other containers of the monorepository only, never from the host and never
# from the internet. It sits on the `internal` network, which has no
# outbound access at all.
#
# The credentials of the database live with the stack that owns them —
# `db/postgres/.env` — and they travel to the service through the
# `env_file` below. The service assembles the connection string out of them.
#
# The definitions of the network are repeated here, identically, so the
# stack also runs on its own:
#
#   docker compose up --wait                          # the whole monorepository
#   docker compose -f apps/db-admin/compose.yaml up  # this stack alone
#
# There is no `depends_on` on the other stacks: a cross-file dependency
# only resolves inside the merged project, and this stack must run on its
# own.

name: paca

services:
  db-admin:
    build:
      # The context is the root of the monorepository: the service imports
      # the shared libraries of the repository, and they are modules of
      # their own next to it.
      context: ../..
      dockerfile: apps/db-admin/Dockerfile
      args:
        GO_IMAGE: golang:1.27.3-alpine3.23@sha256:754d5200fc3edae76d3b6598a9a3fac7e74981ee6a5413ab955025f185753ef2
        RUNTIME_IMAGE: gcr.io/distroless/static-debian12:nonroot@sha256:afa5c872c891853ca7fcf1f12c3edb23f7eeef36189728842dd51042ff57f7ab
        VERSION: ${PACA_VERSION:-dev}
    image: paca/db-admin:${PACA_VERSION:-dev}
    container_name: paca-db-admin
    restart: unless-stopped
    stop_grace_period: 15s
    # The credentials of the database live with the stack that owns them.
    # They are written once, and they travel to the service from there.
    #
    # The stack does not set `PACA_DATABASE_URL`: the connection string is
    # assembled by the service out of the credentials above, and a value
    # that an operator sets outside the stack is not shadowed by it.
    env_file:
      - path: ../../db/postgres/.env
        required: false
    environment:
      # The service binds the interface of the container, so the other
      # containers of the stack reach it. It publishes no port, so the host
      # does not.
      PACA_DB_ADMIN_HOST: "0.0.0.0"
      # The port reserved for the database admin service of the
      # monorepository.
      PACA_DB_ADMIN_PORT: "8082"
      PACA_LOG_LEVEL: "info"
      # How long the writer waits for the database before it gives up.
      #
      # The database and the writer start at the same moment, and the
      # database accepts the connections a couple of seconds after its
      # container starts: the writer waits for it instead of exiting. The
      # start period of the health check below is longer than this budget,
      # so the container is never declared unhealthy while the writer waits.
      PACA_DB_ADMIN_DATABASE_WAIT_TIMEOUT: "60s"
      # The database of the stack. The credentials of it come from the
      # `env_file` above, and the service assembles the connection string.
      PACA_DATABASE_HOST: "postgres"
      PACA_DATABASE_PORT: "5432"
      # The traces go to the collector of the observability stack. It sits
      # on the same internal network, so the service keeps its promise of no
      # outbound access to the internet. The traffic inside that network is
      # not encrypted: it never leaves the host.
      OTEL_EXPORTER_OTLP_ENDPOINT: "jaeger:4317"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      # The traces of this environment carry the name of the environment,
      # so a trace of a development run is never mixed with a trace of
      # another one.
      OTEL_RESOURCE_ATTRIBUTES: "deployment.environment.name=development"
    # The port is exposed to the network of the stack, not published to the
    # host. There is no `ports:` mapping here, on purpose.
    expose:
      - "8082"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "/app/paca-db-admin", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      # The writer waits for the database before it serves, and the
      # database accepts the connections a couple of seconds after its
      # container starts. The start period covers that wait: the container
      # is not declared unhealthy while the writer waits for its database.
      #
      # It is longer than the budget of the wait of the service (60
      # seconds by default), so the writer is never declared unhealthy
      # while it is still waiting.
      start_period: 90s
    # The container runs as a non-root user, without any capability, and
    # without the ability to gain more.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  # Declared here with the same attributes as the root compose, so this
  # stack also runs on its own. The name is fixed, so the network is the
  # same one whichever way the stack is started.
  internal:
    name: paca_internal
    driver: bridge
    internal: true
