# The stack of the memory of PACA: Engram.
#
# The store of the memory of the monorepository. It is a container of its
# own, with its own image and its own state, and it publishes no port: the
# agent will reach it through the socket of its volume, when the slice of
# the wiring of the agent comes.
#
# The stack belongs to the root compose project, so it runs alone and with
# the monorepository:
#
#   docker compose -f engram/compose.yaml up --wait   # this stack alone
#   docker compose up --wait                          # every stack

name: paca

services:
  engram:
    build:
      # The context is the root of the monorepository, like the image of
      # every other service that the repository builds.
      context: ..
      dockerfile: engram/Dockerfile
      args:
        # The base image is pinned by digest, like every image of the
        # repository.
        BASE_IMAGE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
        # The payload is the official release of Engram, pinned by version
        # and verified by the checksum of its architecture: the build fails
        # when the bytes are not the ones that were pinned.
        ENGRAM_VERSION: "3.7.1"
        ENGRAM_SHA256_AMD64: "bc1acef625f16923b2ba548e0c911996b30d65c7c7cf15e949ecbc58136b127b"
        ENGRAM_SHA256_ARM64: "d5023e786af7cefe07a5d46f8064851d5f89be73bdb10af4a148358ed0605583"
    image: paca/engram:${PACA_VERSION:-dev}
    container_name: paca-engram
    restart: unless-stopped
    stop_grace_period: 15s
    # The payload of the store is published before the store runs: the
    # publication is the first step of the lifecycle of the stack of the
    # memory, and the store waits for it because it is the very executable
    # that the agent of PACA spawns.
    depends_on:
      engram-payload:
        condition: service_completed_successfully
    # The credentials live with the stack that owns them: `engram/.env`. The
    # file is written by the installer of the environment, which finds the
    # manifest of the stack on its own.
    env_file:
      - .env
    environment:
      # The state of the store: the database of the memories, on the volume
      # below.
      ENGRAM_DATA_DIR: /data
      # The socket of the volume is the only address of the store: the
      # local runtime of Engram binds the loopback of its own container and
      # refuses any other, so the socket is what leaves the container. The
      # container that mounts the volume reaches it there.
      ENGRAM_SOCKET: /data/engram.sock
      # The project of the monorepository: the memories of PACA belong to
      # it, and the stack names it once so that nothing has to guess it.
      ENGRAM_PROJECT: paca
      # The store answers on the socket of the volume and on nothing else,
      # and that is not a convention: Engram refuses to combine the socket
      # transport with an explicit TCP port (`ENGRAM_PORT`), so the store of
      # this stack binds no TCP port at all. The default of Engram (`7437`)
      # belongs to the local Engram of the machine of the developer, and the
      # store of PACA must never be the instance that owns it. A TCP port
      # for this stack would need `ENGRAM_SOCKET` unset and a port that is
      # not `7437`, and that is a decision of the architecture, not a value
      # of a manifest: the manifest carries no port, and `ENGRAM_PORT` is
      # never written into it.
    volumes:
      # The whole state of the store: the database of the memories and the
      # socket of the API. It is a named volume, so the state survives a
      # restart of the stack and never touches the tree of the repository.
      #
      # A named volume and not a bind mount: the database is SQLite in WAL
      # mode, and WAL is not safe on a mount that crosses the boundary of
      # the virtual machine — the pages of the database would be silently
      # corrupted. The volume of Docker lives on the filesystem of the
      # machine, and WAL is safe there.
      - engram-data:/data
      # The proof of the stack lives in the repository, so the reviewer reads
      # it there and not in the image.
      - ./smoke.sh:/usr/local/bin/paca-engram-smoke:ro
    # No `ports:` mapping on purpose, and no `expose:` either: the store
    # answers on the socket of its volume and on nothing else.
    networks:
      # The service-to-service network, which has no outbound access at all.
      - internal
    healthcheck:
      # The health of the store is the health endpoint of its API, asked
      # through the socket of the volume: the endpoint needs no key, and it
      # says whether the store answers, and nothing else.
      #
      # The check runs as the user of the store, because the socket of the
      # volume is private to that user and the container keeps no capability
      # that would let another user reach it.
      test: ["CMD-SHELL", "su-exec 10000:10000 curl -fsS --unix-socket /data/engram.sock -o /dev/null http://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    # The file system of the container is read-only: the store writes the
    # database of the memories and nothing else, and it goes to the volume
    # above.
    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    cap_add:
      # The entrypoint of the image gives the state of the volume to the
      # user of the store and drops the privileges of the process before the
      # store runs, exactly like the image of the agent does at boot.
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true

  # The one-shot service that publishes the payload of the store: the
  # verified executable of the store, written on the volume that the stack
  # of the agent mounts read-only.
  #
  # The payload has one owner: the stack of the memory builds it, verifies
  # it and publishes it. The image of the agent carries no payload of the
  # store anymore — it mounts the volume below and points its MCP
  # configuration at the executable, the way any other MCP agent does.
  #
  # It is built from the image of the store, with the same context, the
  # same dockerfile and the same build arguments, so the payload it
  # publishes is the very executable that the store runs.
  #
  # It runs as the root of the container, because the volume is created by
  # Docker owned by root, and it overrides the entrypoint of the image: the
  # entrypoint of the image owns the state of the store, and the
  # publication owns the payload instead.
  engram-payload:
    build:
      # The context is the root of the monorepository, like the image of
      # every other service that the repository builds.
      context: ..
      dockerfile: engram/Dockerfile
      args:
        # The base image is pinned by digest, like every image of the
        # repository.
        BASE_IMAGE: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
        # The payload is the official release of Engram, pinned by version
        # and verified by the checksum of its architecture: the build fails
        # when the bytes are not the ones that were pinned.
        ENGRAM_VERSION: "3.7.1"
        ENGRAM_SHA256_AMD64: "bc1acef625f16923b2ba548e0c911996b30d65c7c7cf15e949ecbc58136b127b"
        ENGRAM_SHA256_ARM64: "d5023e786af7cefe07a5d46f8064851d5f89be73bdb10af4a148358ed0605583"
    image: paca/engram:${PACA_VERSION:-dev}
    container_name: paca-engram-payload
    # The service runs once and it ends: it is not restarted.
    restart: "no"
    # The volume is owned by root, so the publication runs as root.
    user: "0:0"
    # The entrypoint of the image is replaced here, and only here: it owns
    # the state of the store, and the publication owns the payload.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        cp /opt/engram/engram /payload/engram
        chmod 0755 /payload/engram
    volumes:
      # The volume that carries the payload of the store: the stack of the
      # agent mounts it read-only and names the executable in it.
      - engram-payload:/payload
    networks:
      # The publication talks to nothing: it stays on the internal network,
      # which has no outbound access at all.
      - internal

networks:
  # Declared here with the same attributes as the root compose, so this
  # stack also runs on its own. The name is fixed, so the network is the
  # same one whichever way the stack is started.
  internal:
    name: paca_internal
    driver: bridge
    internal: true

volumes:
  engram-data:
    name: paca-engram-data
  # The payload of the store: the verified executable, published by the
  # service above and mounted read-only by the stack of the agent. The name
  # is the contract between the two stacks.
  engram-payload:
    name: paca-engram-payload
