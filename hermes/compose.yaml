# The stack of the agent of PACA: Hermes Agent.
#
# The agent is the unit of the monorepository that talks to the people who
# use PACA. It is not a Go module: it is a container that brings its own
# image, like the database and the collector of the traces, so it lives in
# a directory of its own with its own compose file.
#
# The stack belongs to the root compose project, so it runs alone and with
# the monorepository:
#
#   docker compose -f hermes/compose.yaml up --wait   # this stack alone
#   docker compose up --wait                          # every stack

name: paca

services:
  # The one-shot service that prepares the state of the agent. It runs
  # before the gateway comes up, it writes the configuration of the agent
  # into the volume of its state, and it gives the state of the memory to
  # the user of the agent.
  #
  # It is a service of its own because the configuration of the agent
  # cannot be a read-only mount: Hermes rewrites `config.yaml` at boot (it
  # migrates it and it keeps timestamped backups of it), so the file is
  # seeded into the volume, once, and it is left to Hermes afterwards.
  #
  # It also refuses the stack when the credential of the provider of the
  # models is missing: the agent cannot call a model without it, and the
  # credential belongs to the DevOps engineer who runs the project.
  hermes-init:
    build:
      # The context is the root of the monorepository, like the image of
      # every other service that the repository builds.
      context: ..
      dockerfile: hermes/Dockerfile
      args:
        # The image of the agent is pinned by digest, like every image of
        # the repository. The digest is the one of the index of the
        # multi-architecture image, so the same pin serves amd64 and arm64.
        HERMES_IMAGE: nousresearch/hermes-agent:stable@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    image: paca/hermes:${PACA_VERSION:-dev}
    container_name: paca-hermes-init
    # The service runs once and it ends: it is not restarted.
    restart: "no"
    # The entrypoint of the image is replaced here, and only here: the
    # seeding needs the root of the container to give the ownership of the
    # volumes to the user of the agent, and a process without capabilities
    # cannot do it. Every command of Hermes drops to the user of the agent
    # on its own.
    entrypoint: ["/bin/sh", "/opt/hermes/init.sh"]
    # The credentials of the stack live with the stack that owns them:
    # `hermes/.env`. The file is written by the installer of the
    # environment, which finds the manifest of the stack on its own.
    env_file:
      - .env
    environment:
      # The state of the memory: the database of the memories, on the
      # volume of the stack of the memory. The MCP server of the store is a
      # process of the agent, so the agent mounts the volume of the store.
      - ENGRAM_DATA_DIR=/opt/engram-data
      # The project of the monorepository: the memories of PACA belong to
      # it, and the stack names it once so that nothing has to guess it.
      - ENGRAM_PROJECT=paca
      # The credential of the provider of the models: the value of the
      # `.env` of the stack, and the value of the environment of the host
      # when it has one (the continuous integration and the gate of the
      # repository use that: a placeholder, never a real credential).
      - OPENROUTER_API_KEY
    volumes:
      # The state of the agent: the configuration that is seeded, the
      # identity, the sessions and the logs.
      - hermes-data:/opt/data
      # The state of the memory, so the seeding can give it to the user of
      # the agent before the gateway comes up.
      - engram-data:/opt/engram-data
      # The payload of the memory: the verified executable of the store,
      # published by the stack of the memory on the volume
      # `paca-engram-payload`. It is mounted read-only — the agent runs
      # the executable and it never writes it — and the seeding waits for
      # it before it writes the configuration of the agent.
      - engram-payload:/opt/engram:ro
    networks:
      # The seeding talks to nothing: it stays on the internal network,
      # which has no outbound access at all.
      - internal

  hermes:
    build:
      # The context is the root of the monorepository, like the image of
      # every other service that the repository builds.
      context: ..
      dockerfile: hermes/Dockerfile
      args:
        # The image of the agent is pinned by digest, like every image of
        # the repository. The digest is the one of the index of the
        # multi-architecture image, so the same pin serves amd64 and arm64.
        HERMES_IMAGE: nousresearch/hermes-agent:stable@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
    image: paca/hermes:${PACA_VERSION:-dev}
    container_name: paca-hermes
    restart: unless-stopped
    # The gateway is the long-running process of the agent: it serves the
    # messaging platforms and the cron scheduler. Inside the image it is
    # supervised by s6, so it restarts itself when it crashes, and the
    # container stays up.
    #
    # The entrypoint of the image is left alone on purpose: it is the one
    # that starts the supervision tree and the one that reaps the orphans
    # the tools of the agent leave behind. A container that overrides it
    # loses both.
    command: ["gateway", "run"]
    # The gateway writes its state on the way out, so it is given the time
    # to do it before the container is killed.
    stop_grace_period: 30s
    # The state of the agent is prepared before the gateway comes up: the
    # configuration of the agent is seeded into the volume, and the stack
    # refuses to come up when the credential of the provider is missing.
    depends_on:
      hermes-init:
        condition: service_completed_successfully
    volumes:
      # The whole state of the agent lives under /opt/data: its
      # configuration, its identity, its sessions, its skills, its memories
      # and its logs. It is a named volume, so the state survives a restart
      # of the stack and never touches the tree of the repository.
      #
      # A named volume and not a bind mount: the sessions live in a SQLite
      # database in WAL mode, and WAL is not safe on a mount that crosses
      # the boundary of the virtual machine — the pages of the database
      # would be silently corrupted. The volume of Docker lives on the
      # filesystem of the machine, and WAL is safe there.
      - hermes-data:/opt/data
      # The state of the memory: the database of the memories and the
      # socket of the API of the store. The MCP server of the store is a
      # process of the agent — the agent spawns it over the stdio
      # transport — and it opens the state of the store directly, because
      # the local runtime of Engram is local first: the store and the
      # agent share the volume, and both run as the same user.
      - engram-data:/opt/engram-data
      # The payload of the memory: the verified executable of the store,
      # published by the stack of the memory on the volume
      # `paca-engram-payload`. It is mounted read-only: the agent spawns
      # the MCP server of the store out of it, and it never writes it.
      - engram-payload:/opt/engram:ro
      # The proof of the stack lives in the repository, so the reviewer
      # reads it there and not in the image.
      - ./smoke.sh:/usr/local/bin/paca-hermes-smoke:ro
      - ./mcp-roundtrip.py:/usr/local/bin/paca-hermes-mcp-roundtrip.py:ro
    # The credentials of the stack live with the stack that owns them:
    # `hermes/.env`. They travel to the container from there.
    #
    # The `environment:` block names the credential of the provider
    # WITHOUT a value, so the container keeps the value of the `.env` when
    # the host has none, and takes the value of the host when it has one.
    # A value written there (`OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"`)
    # would be interpolated from the `.env` of the ROOT in the root
    # compose project, and it would replace the real credential with an
    # empty string.
    env_file:
      - .env
    environment:
      # The API server of the agent is the surface the health of the stack
      # is asked on. It is gated on this variable, and it binds the
      # loopback interface of the container: nothing outside the container
      # reaches it, and it needs no key.
      - API_SERVER_ENABLED=true
      # The state of the memory and the project of the monorepository. The
      # MCP server of the store is spawned with them, so the memories it
      # writes belong to the project of PACA.
      - ENGRAM_DATA_DIR=/opt/engram-data
      - ENGRAM_PROJECT=paca
      # The credential of the provider of the models: the value of the
      # `.env` of the stack, and the value of the environment of the host
      # when it has one (the continuous integration and the gate of the
      # repository use that: a placeholder, never a real credential).
      - OPENROUTER_API_KEY
    # The browser of the agent needs more shared memory than the 64
    # megabytes Docker gives by default.
    shm_size: "1gb"
    deploy:
      resources:
        limits:
          # The limits the documentation of the image recommends: the agent
          # is a Python runtime with a browser, and it must not starve the
          # machine it runs on.
          memory: 4G
          cpus: "2.0"
    networks:
      # The agent talks to the other services of the monorepository — the
      # MCP server, above all — on the internal network.
      - internal
      # The agent talks to the provider of the models, and to nothing else
      # of PACA: it carries the personal data of the people to the model,
      # and the internal network is the one that has no outbound access.
      # This is the decision the stack of the agent deferred, and the
      # credential of the provider makes it unavoidable.
      - egress
    healthcheck:
      # The API server of the agent answers a health request on the
      # loopback interface of the container. The image ships curl, and the
      # endpoint needs no key: it says whether the agent is alive, and
      # nothing else.
      test: ["CMD", "/usr/bin/curl", "-fsS", "-m", "5", "-o", "/dev/null", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # The image unpacks its bundled skills and starts the supervision
      # tree before the gateway answers: the first answer takes a while.
      start_period: 60s

networks:
  # Declared here with the same attributes as the root compose, so this
  # stack also runs on its own. The name is fixed, so the network is the
  # same one whichever way the stack is started.
  internal:
    name: paca_internal
    driver: bridge
    internal: true
  # The outbound traffic of the agent: the provider of the models. The
  # network is the plain bridge of the root compose, so it is the same one
  # whichever way the stack is started.
  egress:
    name: paca_egress
    driver: bridge

volumes:
  hermes-data:
    name: paca-hermes-data
  # The state of the memory: the same volume the stack of the memory
  # owns, with the same name, so the agent and the store share it.
  engram-data:
    name: paca-engram-data
  # The payload of the memory: the verified executable of the store,
  # published by the stack of the memory with the same name, so the agent
  # mounts the payload that the store published.
  engram-payload:
    name: paca-engram-payload
